services:

  # ── MySQL Database (staging) ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: jjlm-staging-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jjlm_staging_db
      MYSQL_USER: jjlm_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_staging_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jjlm-staging-network

  # ── Backend (staging) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./BACKEND
    container_name: jjlm-staging-backend
    environment:
      NODE_ENV: staging
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: jjlm_staging_db
      DB_USER: jjlm_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: https://staging.jjlm.edwsystem.com,https://staging.api.jjlm.edwsystem.com,https://localhost,capacitor://localhost
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: BFs2khE7TREeTo_S95ob5C_JBfpjvhTsnw2eRezgJ2jH8_Jh9V8tC0Xtcj9sEkpjhxpmXD1_dYzpeWOBEN9-fVw
      VAPID_PRIVATE_KEY: 6kvoyQf61Kdif0a4n5kIWwbxirkf6BX8cF5Nv2gPQSQ
      VAPID_SUBJECT: mailto:admin@jjlm.com
    # Ejecuta el seeder en el primer arranque, luego inicia el servidor
    command: sh -c "node dist/seeders/seed.js; npm start"
    volumes:
      - backend_staging_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - jjlm-staging-network
      - dokploy-network

  # ── Frontend (staging) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_BASE_URL: https://staging.api.jjlm.edwsystem.com/api
    container_name: jjlm-staging-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jjlm-staging-network
      - dokploy-network

networks:
  jjlm-staging-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mysql_staging_data:
    driver: local
  backend_staging_logs:
    driver: local
