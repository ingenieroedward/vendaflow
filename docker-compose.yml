services:

  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: jjlm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jjlm_db
      MYSQL_USER: jjlm_user
      MYSQL_PASSWORD: jjlm_passwordya
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jjlm-network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./BACKEND
    container_name: jjlm-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: jjlm_db
      DB_USER: jjlm_user
      DB_PASSWORD: jjlm_password
      DB_DIALECT: mysql
      JWT_SECRET: jjlm_jwt_super_secret_2026
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: https://jjlm.edwsystem.com,https://api.jjlm.edwsystem.com,https://localhost,capacitor://localhost
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: BFs2khE7TREeTo_S95ob5C_JBfpjvhTsnw2eRezgJ2jH8_Jh9V8tC0Xtcj9sEkpjhxpmXD1_dYzpeWOBEN9-fVw
      VAPID_PRIVATE_KEY: 6kvoyQf61Kdif0a4n5kIWwbxirkf6BX8cF5Nv2gPQSQ
      VAPID_SUBJECT: mailto:admin@jjlm.com
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - jjlm-network
      - dokploy-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_BASE_URL: https://api.jjlm.edwsystem.com/api
    container_name: jjlm-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jjlm-network
      - dokploy-network

networks:
  jjlm-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
