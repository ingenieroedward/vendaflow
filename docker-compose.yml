services:

  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: merco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: merco_db
      MYSQL_USER: merco_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merco_password}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - merco-network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./BACKEND
    container_name: merco-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: merco_db
      DB_USER: merco_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-merco_password}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: https://merco.edwsystem.com,https://api.merco.edwsystem.com,https://localhost,capacitor://localhost
      CORS_WILDCARD_ORIGIN: "*.merco.edwsystem.com"
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: mailto:admin@edwsystem.com
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - merco-network
      - dokploy-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_BASE_URL: https://api.merco.edwsystem.com/api
    container_name: merco-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - merco-network
      - dokploy-network

networks:
  merco-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
