services:

  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: merco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: merco_db
      MYSQL_USER: merco_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merco_password}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dokploy-network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./BACKEND
    container_name: merco-backend
    environment:
      NODE_ENV: production
      TZ: America/Bogota
      PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: merco_db
      DB_USER: merco_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-merco_password}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      DOKPLOY_API_TOKEN: ${DOKPLOY_API_TOKEN}
      DOKPLOY_URL: ${DOKPLOY_URL:-http://dokploy:3000}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: https://merco.edwsystem.com,https://api.merco.edwsystem.com,https://localhost,capacitor://localhost
      CORS_WILDCARD_ORIGIN: "*.merco.edwsystem.com"
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: mailto:admin@edwsystem.com
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dokploy-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_BASE_URL: https://api.merco.edwsystem.com/api
    container_name: merco-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.merco-wildcard.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.merco.edwsystem.com`)"
      - "traefik.http.routers.merco-wildcard.entrypoints=websecure"
      - "traefik.http.routers.merco-wildcard.tls=true"
      - "traefik.http.routers.merco-wildcard.tls.certresolver=letsencrypt"
      - "traefik.http.services.merco-wildcard.loadbalancer.server.port=80"
      - "traefik.http.routers.merco-wildcard-http.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.merco.edwsystem.com`)"
      - "traefik.http.routers.merco-wildcard-http.entrypoints=web"
      - "traefik.http.routers.merco-wildcard-http.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  dokploy-network:
    external: true

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
