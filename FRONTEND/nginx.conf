server {
    listen 80;
    # Acepta el dominio raíz y cualquier subdominio de tenant
    # Traefik enruta *.merco.edwsystem.com a este contenedor
    server_name merco.edwsystem.com ~^(?<tenant_slug>[^.]+)\.merco\.edwsystem\.com$;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — re-resolve backend IP on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA routing — todas las rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend interno (docker network)
    # Pasa X-Tenant-Slug para que el backend sepa qué tenant es (complementa la detección en frontend)
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker sin cache
    location /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
