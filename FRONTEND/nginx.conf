# Solo el dominio raíz (landing) es indexable; tenants y admin quedan fuera de Google
map $host $robots_header {
    default "noindex, nofollow";
    merco.edwsystem.com "";
}

# Superadmin — app separada solo en admin.merco.edwsystem.com
server {
    listen 80;
    server_name admin.merco.edwsystem.com;

    root /usr/share/nginx/html;

    # Cabeceras de seguridad (helmet solo cubre la API; el HTML lo sirve nginx)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprobantes de pago viajan en base64 (~2.7MB por 2MB de imagen) — el
    # default de nginx es 1M y devolvía 413 antes de llegar al backend
    client_max_body_size 8m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri /admin.html;
    }

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3005$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    # Acepta el dominio raíz y cualquier subdominio de tenant
    # Traefik enruta *.merco.edwsystem.com a este contenedor
    server_name merco.edwsystem.com ~^(?<tenant_slug>[^.]+)\.merco\.edwsystem\.com$;

    root /usr/share/nginx/html;
    index index.html;

    # Header vacío en el dominio raíz = no se envía; en subdominios = noindex
    add_header X-Robots-Tag $robots_header always;

    # Cabeceras de seguridad (helmet solo cubre la API; el HTML lo sirve nginx)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprobantes de pago viajan en base64 (~2.7MB por 2MB de imagen) — el
    # default de nginx es 1M y devolvía 413 antes de llegar al backend
    client_max_body_size 8m;


    # Docker internal DNS — re-resolve backend IP on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA routing — todas las rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manifest dinámico por tenant — el backend personaliza name/theme_color
    # según el subdominio. Si el backend no responde, cae al manifest estático.
    location = /manifest.json {
        set $backend_host backend;
        proxy_pass http://$backend_host:3005/api/manifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @manifest_static;
    }

    location @manifest_static {
        default_type application/manifest+json;
        try_files /manifest.json =404;
    }

    # Digital Asset Links — Android verifica aquí el APK TWA del tenant
    # (sin esto el APK abre con la barra de URL de Chrome visible)
    location = /.well-known/assetlinks.json {
        set $backend_host backend;
        proxy_pass http://$backend_host:3005/api/assetlinks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug $tenant_slug;
    }

    # Proxy API → backend interno (docker network)
    # Pasa X-Tenant-Slug para que el backend sepa qué tenant es (complementa la detección en frontend)
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3005$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker sin cache
    location /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
