<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Merco — Software de gestión para distribuidoras en Colombia</title>
    <meta name="description" content="Controla precios de proveedores, ventas, cartera e inventario en un solo lugar. Funciona sin internet. Prueba gratis 14 días." />

    <!-- Open Graph: vista previa al compartir por WhatsApp/redes -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Merco" />
    <meta property="og:title" content="Merco — Software de gestión para distribuidoras" />
    <meta property="og:description" content="Precios de proveedores, ventas, cartera e inventario en un solo lugar. Funciona sin internet. Prueba gratis 14 días." />
    <meta property="og:url" content="https://merco.edwsystem.com/" />
    <meta property="og:image" content="https://merco.edwsystem.com/icons/icon-512x512.png" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (Android Chrome barra superior) -->
    <meta name="theme-color" content="#0057ff" />
    <meta name="color-scheme" content="light" />

    <!-- Android Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Merco" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS Apple Touch Icons (Safari ignora manifest.json) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker registrado desde main.tsx via serviceWorkerRegistration -->
  </body>
</html>
