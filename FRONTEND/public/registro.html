<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crea tu cuenta gratis · Merco</title>
  <meta name="description" content="Registra tu negocio en Merco y prueba gratis el software de ventas, inventario y comparación de precios de proveedores para negocios en Colombia. Con el código LANZAMIENTO obtienes 30 días gratis." />
  <link rel="canonical" href="https://merco.edwsystem.com/registro" />
  <meta name="theme-color" content="#3b82f6" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://merco.edwsystem.com/registro" />
  <meta property="og:title" content="Crea tu cuenta gratis en Merco" />
  <meta property="og:description" content="30 días gratis con el código LANZAMIENTO. Sin tarjeta de crédito." />
  <meta property="og:image" content="https://merco.edwsystem.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    :root { --primary: #2563eb; --primary-600: #1d4ed8; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #475569; --border: #cbd5e1; --ok: #15803d; --err: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #0f172a; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --primary: #3b82f6; --primary-600: #60a5fa; --ok: #4ade80; --err: #f87171; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; margin-bottom: 20px; }
    .brand img { width: 36px; height: 36px; border-radius: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.15rem; margin: 0 0 8px; }
    p.muted { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--card); color: var(--text); }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .slug-row { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .slug-row input { border: 0; border-radius: 0; min-width: 0; }
    .slug-row span { padding: 0 10px; color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; min-height: 1.2em; }
    .hint.ok { color: var(--ok); } .hint.err { color: var(--err); }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    button { width: 100%; margin-top: 20px; background: var(--primary); color: #fff; border: 0; padding: 13px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--primary-600); }
    button:disabled { opacity: .6; cursor: wait; }
    .alert { padding: 12px; border-radius: 10px; margin-top: 16px; display: none; }
    .alert.err { display: block; background: rgba(185,28,28,.1); color: var(--err); }
    .alert.ok { display: block; background: rgba(21,128,61,.1); color: var(--ok); }
    .promo-badge { display: inline-block; background: #f59e0b; color: #111; font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><img src="/icons/icon-96x96.png" alt="Logo de Merco" width="36" height="36" />Merco</a>

    <main class="card">
      <span class="promo-badge" id="promoBadge" hidden>🚀 30 días gratis</span>
      <h1>Crea tu cuenta gratis</h1>
      <p class="muted">Sin tarjeta de crédito. Tu negocio queda listo en 2 minutos.</p>

      <form id="form" novalidate>
        <label for="companyName">Nombre de tu negocio</label>
        <input id="companyName" name="companyName" required minlength="2" maxlength="255" autocomplete="organization" placeholder="Distribuidora La Esquina" />

        <label for="slug">Tu dirección en Merco</label>
        <div class="slug-row">
          <input id="slug" name="slug" required minlength="3" maxlength="50" pattern="[a-z0-9]+(-[a-z0-9]+)*" autocapitalize="off" autocomplete="off" placeholder="la-esquina" />
          <span>.merco.edwsystem.com</span>
        </div>
        <div class="hint" id="slugHint">Solo minúsculas, números y guiones.</div>

        <label for="adminUsername">Usuario administrador</label>
        <input id="adminUsername" name="adminUsername" required minlength="3" maxlength="100" autocomplete="username" autocapitalize="off" placeholder="admin" />

        <label for="adminPassword">Contraseña</label>
        <input id="adminPassword" name="adminPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />

        <label for="promoCode">Código promocional (opcional)</label>
        <input id="promoCode" name="promoCode" maxlength="50" autocapitalize="characters" placeholder="LANZAMIENTO" />
        <div class="hint" id="promoHint"></div>

        <!-- Honeypot anti-bots: no llenar -->
        <div class="hp" aria-hidden="true">
          <label for="website">Sitio web</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit">Crear mi cuenta</button>
        <div class="alert" id="alert" role="status"></div>
      </form>
    </main>

    <section class="card" id="ingresar">
      <h2>¿Ya tienes cuenta?</h2>
      <p class="muted">Escribe la dirección de tu negocio para ingresar.</p>
      <form id="loginForm" class="slug-row">
        <input id="loginSlug" aria-label="Dirección de tu negocio" required autocapitalize="off" placeholder="tu-negocio" />
        <span>.merco.edwsystem.com</span>
      </form>
      <button type="submit" form="loginForm">Ir a mi cuenta</button>
    </section>
  </div>

  <script>
    (function () {
      var ROOT_DOMAIN = 'merco.edwsystem.com';
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);

      function tenantUrl(slug) {
        // En local (localhost) usa ?tenant= ; en producción, el subdominio
        if (location.hostname.indexOf(ROOT_DOMAIN) === -1) return location.origin + '/login?tenant=' + encodeURIComponent(slug);
        return 'https://' + slug + '.' + ROOT_DOMAIN + '/login';
      }

      function toSlug(text) {
        return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
      }

      function setHint(el, msg, kind) { el.textContent = msg; el.className = 'hint' + (kind ? ' ' + kind : ''); }

      // Precargar código promocional desde ?promo=
      var promo = params.get('promo');
      if (promo) $('promoCode').value = promo.toUpperCase();

      // Slug sugerido a partir del nombre
      var slugTouched = false;
      $('companyName').addEventListener('input', function () {
        if (!slugTouched) { $('slug').value = toSlug(this.value); checkSlug(); }
      });
      $('slug').addEventListener('input', function () {
        slugTouched = true;
        this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
        checkSlug();
      });

      var slugTimer, slugAvailable = null;
      function checkSlug() {
        clearTimeout(slugTimer);
        var slug = $('slug').value;
        slugAvailable = null;
        if (slug.length < 3 || !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) {
          setHint($('slugHint'), 'Mínimo 3 caracteres: minúsculas, números y guiones.', slug ? 'err' : '');
          return;
        }
        setHint($('slugHint'), 'Verificando…');
        slugTimer = setTimeout(function () {
          fetch('/api/tenants/slug/' + encodeURIComponent(slug)).then(function (r) {
            if (r.status === 404) { slugAvailable = true; setHint($('slugHint'), '✓ ' + slug + '.' + ROOT_DOMAIN + ' está disponible', 'ok'); }
            else if (r.ok) { slugAvailable = false; setHint($('slugHint'), 'Esa dirección ya está en uso, prueba otra.', 'err'); }
            else { setHint($('slugHint'), ''); }
          }).catch(function () { setHint($('slugHint'), ''); });
        }, 400);
      }

      var promoTimer;
      function checkPromo() {
        clearTimeout(promoTimer);
        var code = $('promoCode').value.trim();
        $('promoBadge').hidden = true;
        if (!code) { setHint($('promoHint'), ''); return; }
        promoTimer = setTimeout(function () {
          fetch('/api/onboarding/promo/' + encodeURIComponent(code)).then(function (r) { return r.json(); }).then(function (d) {
            if (d.valid) { setHint($('promoHint'), '✓ Código válido: ' + d.trialDays + ' días gratis', 'ok'); $('promoBadge').textContent = '🚀 ' + d.trialDays + ' días gratis'; $('promoBadge').hidden = false; }
            else setHint($('promoHint'), 'Código no válido. Tendrás la prueba estándar de ' + d.trialDays + ' días.', 'err');
          }).catch(function () { setHint($('promoHint'), ''); });
        }, 400);
      }
      $('promoCode').addEventListener('input', checkPromo);
      checkPromo();

      $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var alertEl = $('alert');
        alertEl.className = 'alert';
        if (!this.checkValidity()) { alertEl.textContent = 'Revisa los campos: todos son obligatorios y la contraseña debe tener mínimo 8 caracteres.'; alertEl.className = 'alert err'; return; }
        if (slugAvailable === false) { alertEl.textContent = 'La dirección elegida ya está en uso.'; alertEl.className = 'alert err'; return; }

        var body = {
          companyName: $('companyName').value.trim(),
          slug: $('slug').value.trim(),
          adminUsername: $('adminUsername').value.trim(),
          adminPassword: $('adminPassword').value,
          website: $('website').value
        };
        var code = $('promoCode').value.trim();
        if (code) body.promoCode = code;

        $('submit').disabled = true; $('submit').textContent = 'Creando tu cuenta…';
        fetch('/api/onboarding/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error((res.d && res.d.message) || 'No pudimos crear tu cuenta.');
            alertEl.textContent = '¡Listo! Te llevamos a tu cuenta. Ingresa con el usuario "' + body.adminUsername + '".';
            alertEl.className = 'alert ok';
            setTimeout(function () { location.href = tenantUrl(body.slug); }, 1800);
          })
          .catch(function (err) {
            alertEl.textContent = err.message; alertEl.className = 'alert err';
            $('submit').disabled = false; $('submit').textContent = 'Crear mi cuenta';
          });
      });

      $('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var slug = toSlug($('loginSlug').value);
        if (slug) location.href = tenantUrl(slug);
      });
    })();
  </script>
</body>
</html>
