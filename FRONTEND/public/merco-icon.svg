<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Isometric box / package icon -->
  <!-- Top face -->
  <polygon points="256,108 388,178 256,248 124,178" fill="rgba(255,255,255,0.95)"/>
  <!-- Left face -->
  <polygon points="124,178 256,248 256,404 124,334" fill="rgba(255,255,255,0.60)"/>
  <!-- Right face -->
  <polygon points="388,178 256,248 256,404 388,334" fill="rgba(255,255,255,0.80)"/>

  <!-- Center ribbon band (horizontal across box) -->
  <polygon points="124,248 256,318 388,248 388,278 256,348 124,278" fill="rgba(255,255,255,0.20)"/>
  <!-- Vertical ribbon -->
  <polygon points="240,248 272,248 272,404 240,404" fill="rgba(255,255,255,0.15)"/>
  <polygon points="240,108 272,108 272,248 240,248" fill="rgba(30,64,175,0.25)"/>
</svg>
